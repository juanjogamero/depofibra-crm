# Servidor interno; solo Caddy publica HTTPS. Puerto 8080 NO expuesto al host.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No dar la impresión de que ya existe un backend.
    location ^~ /api/ {
        default_type application/json;
        return 503 '{"error":"BACKEND_NOT_CONFIGURED","mode":"vps-preview"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\\. {
        deny all;
    }
}
